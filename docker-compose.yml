# Recome, PHP and MySQL with two containers
# Start everything with docker compose up

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recome
      MYSQL_USER: recome
      MYSQL_PASSWORD: recome
    volumes:
      - ./data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    ports:
      - "${RECOME_PORT:-8080}:80"
    environment:
      RECOME_SOURCE_URL: https://github.com/uib-gin3/adiu-recome
    volumes:
      - ./www:/var/www/html
    depends_on:
      db:
        condition: service_healthy
